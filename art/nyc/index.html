<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NYC cover pack · Milani artwork frame</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="2" height="2"></canvas>
<script src="nyc.js"></script>
<script>
// One of the 320 NYC templates as a Milani artwork (see art-engine.js: makeSource drives it on a virtual clock).
//   ?t=1..320   template number
//   &m=art      the generative code only, filling the window at the video's shape (a picture behind any template / a music-video shot)
//   &m=cover    the whole cover design with its text layout, letterboxed to the window (the "Generative covers" templates)
//   &h=0x…      seed (the default seed keeps the template's own look); &title= &name= &guest= the visitor's text (cover mode)
// Exposes window.__groklyCanvas() and window.__groklyStep(features, ms), the Milani artwork protocol.
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  const idx = Math.max(0, Math.min(TPLS.length - 1, (parseInt(q.get('t'), 10) || 1) - 1));
  const mode = q.get('m') === 'cover' ? 'cover' : 'art';
  const DEFAULT_SEED = '0x6d696c616e69617274652d6772' + '0'.repeat(38);
  const h = q.get('h') || DEFAULT_SEED;
  if (h !== DEFAULT_SEED) { let x = 2166136261; for (let i = 0; i < h.length; i++) { x ^= h.charCodeAt(i); x = Math.imul(x, 16777619); } state.tpl[idx] = { seed: (x >>> 0) % 99991 }; }
  // the visitor's text in every field the layouts read; sample-only lines (dates, episode numbers…) are left out
  // the visitor's text: from the address (cover mode), else what Milani last set in window.GroklyNYC.text (art mode, music-video shots)
  let PT = {}; try { PT = (parent && parent.GroklyNYC && parent.GroklyNYC.text) || {}; } catch (e) {}
  const title = q.get('title') || PT.title || '', name = q.get('name') || PT.name || '', guest = q.get('guest') || PT.guest || '';
  if (mode === 'cover') Object.assign(state.text, {
    show: name || title || ' ', title: title || ' ', guest: guest || name || ' ', role: guest ? name : '', ep: '',
    headline: title || ' ', kicker: 'New', date: '', artist: name || ' ', track: title || ' ', album: '', release: '', single: 'New Single', mvLabel: 'Music Video',
  });
  else Object.assign(state.text, { show: title || name || ' ', title: title || ' ', headline: title || ' ', track: title || ' ', artist: name || ' ', guest: guest || name || ' ', role: '', ep: '', kicker: 'New', date: '', album: '', release: '', single: 'New Single', mvLabel: 'Music Video' });
  try { const ph = parent && parent.GroklyNYC && parent.GroklyNYC.photo; if (ph && ph.naturalWidth) photo = ph; } catch (e) {}

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const d = TPLS[idx];
  // a cover's sample hero word ("Interview", "Live"…) becomes the visitor's name: no stranger's word as the biggest thing on screen
  if (mode === 'cover' && d.word && !(d.word in state.text)) d.word = 'show';

  // ---- Milani features → the 20 NYC voice parameters (all 0..1; spec 32 bands, wave 128 samples, clk one clock per parameter)
  const st = { env: 0, pS: 0.4, pL: 0.4, spk: 0, mix: 0, hold: 0, beats: 0, prevBeats: 0, ons: [], now: 0, clk: {}, wave: new Float32Array(128) };
  function voice(f, dt) {
    const c = (v) => clamp(+v || 0), lv = c(f.level), bands = f.sbands || f.bands || [];
    st.now += dt; st.env += (lv - st.env) * Math.min(1, dt * (lv > st.env ? 12 : 2.5));
    const pitch = f.pitchHz > 0 ? clamp(Math.log2(f.pitchHz / 80) / Math.log2(5)) : (f.pitch != null ? c(f.pitch) : st.pS);
    const vad = f.voiced != null ? c(f.voiced) : lv > 0.08 ? 1 : 0;
    if (vad > 0.3) { st.pS += (pitch - st.pS) * Math.min(1, dt * 3); st.pL += (pitch - st.pL) * Math.min(1, dt * 0.12); }
    if (vad > 0.3) { const cand = st.pS > st.pL + 0.035 ? 1 : st.pS < st.pL - 0.035 ? 0 : st.spk; if (cand !== st.spk) { st.hold += dt; if (st.hold > 0.6) { st.spk = cand; st.hold = 0; } } else st.hold = 0; }
    st.mix += (st.spk - st.mix) * Math.min(1, dt * 4);
    const beats = f.beats || 0; if (beats > st.prevBeats) { st.beats += beats - st.prevBeats; st.ons.push(st.now); } st.prevBeats = beats;
    if ((f.onset || 0) > 0.6 && (!st.ons.length || st.now - st.ons[st.ons.length - 1] > 0.12)) { st.ons.push(st.now); st.beats++; }
    while (st.ons.length && st.now - st.ons[0] > 2) st.ons.shift();
    const spec = new Float32Array(NB); for (let b = 0; b < NB; b++) spec[b] = c(bands[b]);
    // a waveform drawn from the spectrum (Milani's features have no raw samples): a few partials, louder bands → bigger
    const w = st.wave; for (let i = 0; i < 128; i++) { const x = i / 128; let v = 0; for (let k = 0; k < 6; k++) v += spec[k * 5] * Math.sin(x * TAU * (2 + k * 3) + st.now * (9 + k * 7)) / (1 + k * 0.6); w[i] = clamp(v * 0.8 * Math.sin(Math.PI * x), -1, 1); }
    const A = { lv, env: st.env, onset: Math.max(c(f.onset), (f.beat ? 1 : 0) * 0.8, c(f.pulse) * 0.7), bass: c(f.bass), lowmid: c(f.lowMid), mid: c(f.mid), pres: c(f.presence != null ? f.presence : f.high), air: c(f.air != null ? f.air : f.high),
      cen: c(f.centroid), flux: c(f.flux), pitch: st.pS, into: clamp(0.5 + (f.pitchDelta || 0) * 3) * vad + 0.5 * (1 - vad), zcr: c(f.zcr), flat: c(f.flatness), vad, pause: clamp((f.silence || 0) * 2),
      rate: clamp(st.ons.length / 2 / 7), mix: st.mix, spk: st.spk, beats: st.beats, spec, wave: w, talk: vad > 0.5, sim: false };
    SCALAR.forEach((p) => (st.clk[p] = (st.clk[p] || 0) + dt * crate(A[p]))); A.clk = st.clk; A.ph = st.clk.env;
    return A;
  }

  // ---- one frame. Cover: core's render() with the text intro played once and then held (no 9 s loop in a video).
  // Art: the same pipeline without the layout, at the window's own shape (engines draw in virtual units; the short side is 900/1000).
  function frame(A, tt) {
    if (mode === 'cover') {
      const W = d.fmt === 'yt' ? 1600 : 1000, H = d.fmt === 'yt' ? 900 : 1000, s = Math.min(cv.width / W, cv.height / H), ox = (cv.width - W * s) / 2, oy = (cv.height - H * s) / 2;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = PAL[tst(idx).pal].bg; ctx.fillRect(0, 0, cv.width, cv.height);
      AU.live = A;
      const c2 = sub(Math.ceil(W * s), Math.ceil(H * s)); try { render(idx, c2.getContext('2d'), W * s, tt, false, true); } catch (x) { if (!frame.err) { frame.err = 1; console.warn('nyc', idx + 1, x); } }
      ctx.drawImage(c2, ox, oy); return;
    }
    const a = cv.width / cv.height, yt = a > 1.3, base = yt ? 900 : 1000, W = a >= 1 ? base * a : base, H = a >= 1 ? base : base / a, S = cv.width / W;
    const st0 = tst(idx), F = FONTS[st0.font], T = viewText(st0.tag);
    // the template's own sample word ("Interview", "Live"…) becomes the visitor's title: the picture never shows a stranger's word
    let word = d.word && d.word in T ? T[d.word] : (title || name || d.word || ''); word = word || T.show || ' '; if (F.up) word = word.toUpperCase();
    const M = syncVals(A, false), SM = state.sync.map, P = modPal(PAL[st0.pal], M);
    const ks = M && SM.speed !== 'off' ? Math.min(1, M.g) : 0, kt = M && SM.ticker !== 'off' ? Math.min(1, M.g) : 0;
    const et = T0 + tt + ks * (((A.clk && A.clk[SM.speed]) || 0) - tt), ek = T0 + tt + kt * (((A.clk && A.clk[SM.ticker]) || 0) - tt);
    const e = { ctx, W, H, S, t: et, tk: ek, tt, still: false, M, motion: st0.motion, tag: st0.tag, seed: st0.seed, audio: A, P, F, T, tpl: Object.assign({}, d, { fmt: yt ? 'yt' : 'sq' }), fmt: yt ? 'yt' : 'sq', word, R: rng(st0.seed), N: noise(st0.seed), bx: 0, by: 0, bw: W, bh: H };
    e.fx = W / 2; e.fy = H / 2; e.inner = Math.min(W, H) * 0.1;
    if (M && M.warp > 0.01) { const N0 = e.N, w = Math.min(1.5, M.warp); e.N = (x, y = 0, z = 0) => N0(x + w * 0.35 * Math.sin(y * 2.3 + tt * 1.7), y + w * 0.35 * Math.cos(x * 2.1 + tt * 1.3), z + w * 0.4); }
    ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H); ctx.save();
    let shx = 0, shy = 0; if (M) { const sh = Math.min(1.5, M.shake); shx = (Math.sin(tt * 91.7) + Math.sin(tt * 53.1)) * 0.5 * sh * W * 0.008; shy = (Math.cos(tt * 77.3) + Math.sin(tt * 41.9)) * 0.5 * sh * H * 0.008; ctx.translate(shx, shy); strokeHook(ctx, 1 + 1.3 * M.stroke); }
    try { E[d.engine](e); } catch (x) { if (!frame.err) { frame.err = 1; console.warn('nyc', idx + 1, x); } } finally { unhook(ctx); ctx.restore(); }
    if (M) postFX(e, M);
    if (M && M.grain > 0.02) grain(e, M.grain);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  // text: always settled. The pack's 9 s intro/outro loop would empty the picture every 9 s of a video, and a paused preview
  // (only a few warm-up steps in) would show no text at all; the text motions (wave, bounce, voice sync…) keep moving
  vis = () => 1; // eslint-disable-line no-global-assign
  const subs = {}; const sub = (w, h) => { const k = w + 'x' + h; if (!subs[k]) subs[k] = mk(w, h); const c = subs[k]; c.getContext('2d').setTransform(1, 0, 0, 1, 0, 0); c.getContext('2d').clearRect(0, 0, w, h); return c; };

  // ---- protocol
  let ready = false, last = -1, A0 = null;
  window.__groklyStep = function (f, ms) {
    if (!ready) return;
    const tt = ms / 1000, dt = last < 0 ? 1 / 30 : Math.max(1 / 240, Math.min(0.25, tt - last)); last = tt;
    A0 = voice(f || {}, dt); frame(A0, tt);
  };
  window.__groklyCanvas = () => (ready ? cv : null);
  function size() { const w = Math.max(16, innerWidth | 0), hh = Math.max(16, innerHeight | 0); if (cv.width !== w || cv.height !== hh) { cv.width = w; cv.height = hh; } }
  addEventListener('resize', () => { size(); if (ready && A0) frame(A0, Math.max(0, last)); });
  // fonts first, so the first frame (and every export) is drawn with the template's own typeface
  const fl = [...Object.values(FONTS).map((f) => `${f.w} 40px ${f.fam}`), '400 40px "Hanken Grotesk"', '600 40px "Hanken Grotesk"', '800 40px "Hanken Grotesk"', '900 40px "Hanken Grotesk"'];
  Promise.race([Promise.all(fl.map((s) => document.fonts.load(s, 'Aa').catch(() => {}))), new Promise((r) => setTimeout(r, 4000))]).then(() => {
    cache.clear(); size(); ready = true; A0 = voice({}, 1 / 30); frame(A0, 0);
  });
  // standalone (opened directly, not inside Milani): play on the real clock with the built-in simulated voice
  if (window === window.top) { const t0 = performance.now(); const loop = () => { if (ready) { const tt = (performance.now() - t0) / 1000; last = tt - 1 / 60; const A = simAudio(T0 + tt); A.sim = false; frame(A, tt); } requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
